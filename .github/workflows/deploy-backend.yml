name: Deploy Backend (Laravel)

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-all

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Tests
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
        run: php artisan test

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: Validate Composer
        run: composer validate --no-check-all

      - name: Install Dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Upload Backend
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "backend/**"
          target: "~/siamang/backend"
          strip_components: 1
          overwrite: true

      - name: Optimize Laravel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ~/siamang/backend

            # Sesuaikan dengan versi PHP di server (cek: ls /opt/alt/ | grep php)
            PHP_BIN="/opt/alt/php82/usr/bin/php"

            if [ ! -f .env ]; then
              echo "ERROR: .env tidak ditemukan di server!"
              exit 1
            fi

            # Pastikan situs SELALU keluar dari mode maintenance,
            # walau migrate/step lain gagal.
            trap '$PHP_BIN artisan up || true' EXIT

            set -e

            $PHP_BIN artisan down || true

            # Backup database sebelum migrate (simpan maksimal 5 terakhir)
            mkdir -p storage/backups
            DB_DATABASE=$(grep -m1 '^DB_DATABASE=' .env | cut -d '=' -f2)
            DB_USERNAME=$(grep -m1 '^DB_USERNAME=' .env | cut -d '=' -f2)
            DB_PASSWORD=$(grep -m1 '^DB_PASSWORD=' .env | cut -d '=' -f2)
            BACKUP_FILE="storage/backups/backup_$(date +%Y%m%d_%H%M%S).sql"
            MYSQL_PWD="$DB_PASSWORD" mysqldump -u "$DB_USERNAME" "$DB_DATABASE" > "$BACKUP_FILE" || echo "WARNING: backup gagal, lanjut deploy tanpa backup"
            ls -t storage/backups/backup_*.sql 2>/dev/null | tail -n +6 | xargs -r rm --

            $PHP_BIN artisan migrate --force
            $PHP_BIN artisan storage:link || true

            $PHP_BIN artisan optimize:clear
            $PHP_BIN artisan optimize

            $PHP_BIN artisan queue:restart || true

            chmod -R 775 storage bootstrap/cache

            echo "Siamang Laravel Deploy Success"
